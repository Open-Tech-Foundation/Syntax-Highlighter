name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install tsr
        run: |
          curl -fsSL https://tsr.opentechf.org/install.sh | sh
          echo "$HOME/.tsr/bin" >> $GITHUB_PATH

      - name: Install esdev
        run: |
          curl -fsSL https://esrun.opentechf.org/install.sh | sh
          echo "$HOME/.es-runtime/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsr ci
        run: tsr ci
