# tasks.toml — workspace root anchor and config for `tsr` (https://tsr.opentechf.org)
# Run any task from anywhere in the repo: `tsr <task> [-- <passthrough>]`
# Inspect without executing: `tsr <task> --dry-run`  •  List: `tsr --list`  •  Edit: `tsr --config`

[workspace]
members = ["packages/*"]

# ------------------------------------------------------------------ demo
# Live demo workbench (IDE-style playground) — `esdev start` defaults to http://localhost:5173
[tasks.demo]
run = "esdev start"
dir = "demo"

# Public marketing site and MDX documentation, on AFW. The site is its own pnpm
# project (website/pnpm-workspace.yaml) and installs the library from this
# checkout, so build the library before the site's first `pnpm install`.
[tasks."dev:website"]
run = "esdev start"
dir = "website"

# Writes website/src/version.js from the library's package.json (the navbar badge).
[tasks."site:version"]
run = "esdev scripts/site-version.mjs"

# The deploy build: version badge and library first (deps), then the site —
# the same steps scripts/build-site.sh runs on Cloudflare.
[tasks."build:website"]
deps = ["site:version", "build"]
run = "pnpm install --frozen-lockfile && pnpm run build"
dir = "website"

# ------------------------------------------------------------------ build
[tasks.build]
run = "esdev build --lib src && cp ../../README.md README.md"
dir = "packages/syntax-highlighter"

# ------------------------------------------------------------------ typecheck / test
[tasks.typecheck]
packages = ["packages/*"]
run = "tsc --noEmit"

# Tests run from the workspace root (not the package dir) so esdev's module
# sandbox — which pins resolution to the process working directory — can reach
# pnpm's hoisted store under root node_modules/.pnpm. This lets tests import
# devDependencies like @opentf/std; running `esdev test` inside the package
# dir rejects them ("escapes the sandbox root").
[tasks.test]
run = "esdev test packages/syntax-highlighter"

[tasks."test:e2e"]
run = "esdev test highlight.e2e"
dir = "packages/syntax-highlighter"

# ------------------------------------------------------------------ lint / fmt (Biome)
[tasks.lint]
run = "biome lint"

[tasks.fmt]
run = "biome format --write"

[tasks."fmt:check"]
run = "biome check"

# ------------------------------------------------------------------ bench
# Throughput harness on the esdev runtime: ours vs the top highlighters.
# Emits website/app/bench-data.js for the landing charts (run per release).
[tasks.bench]
run = "esdev bench/throughput.ts"

# Character-level accuracy vs Shiki over the showcase and real-world corpora.
# Rewrites bench/accuracy-baseline.json — commit it when scores improve.
[tasks."bench:accuracy"]
run = "esdev bench/accuracy.ts --update"

# Fails if any language scores below bench/accuracy-baseline.json.
[tasks."accuracy:check"]
run = "esdev bench/accuracy.ts --check"

[tasks."test:bench"]
run = "esdev test bench"

[tasks."typecheck:bench"]
run = "tsc --noEmit -p bench"

# ------------------------------------------------------------------ ci
[tasks.check]
deps = ["typecheck", "typecheck:bench", "lint", "fmt:check", "test", "test:bench"]

[tasks.ci]
deps = ["typecheck", "typecheck:bench", "lint", "fmt:check", "test", "test:bench", "accuracy:check", "build"]
