<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syntax Highlighter — Playground</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css" />
    <link id="sh-theme" rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/default.css" data-theme="default" />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/github-light.css" data-theme="github-light" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/github-dark.css" data-theme="github-dark" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/monokai.css" data-theme="monokai" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/dracula.css" data-theme="dracula" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/nord.css" data-theme="nord" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/solarized-dark.css" data-theme="solarized-dark" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/solarized-light.css" data-theme="solarized-light" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/one-dark.css" data-theme="one-dark" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/gruvbox-dark.css" data-theme="gruvbox-dark" disabled />
    <link rel="stylesheet" href="./node_modules/@opentf/syntax-highlighter/src/themes/tokyo-night.css" data-theme="tokyo-night" disabled />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <!-- The script tag above is what makes src/main.ts a build input, and this
         is what it renders the whole workbench into. -->
    <div id="app"></div>
  </body>
</html>
