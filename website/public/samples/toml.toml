# Showcase: TOML — tables, arrays, and every value type.
title = "highlight-demo"
version = "0.4.0"
debug = false
verbose = true
retries = 3
ratio = 0.975
threshold = 1.6e-19
mask = 0xFF
port = 0o755
big = 1_000_000
empty = ""
greeting = "hello, world"
multiline = """
Roses are red,
violets are "blue"."""

[server]
host = "127.0.0.1"
port = 5173
tls = false
started = 2026-01-15T09:30:00Z
restart_at = 2026-02-01T00:00:00-05:00
maintenance_window = 1979-05-27T07:32:00Z

[server.limits]
body_bytes = 1_048_576
rate_per_minute = 600
timeout = "30s"

[server.tls]
enabled = false
cert = "/etc/ssl/cert.pem"
key = "/etc/ssl/key.pem"
protocols = ["TLSv1.2", "TLSv1.3"]

[client]
endpoints = [
  "https://api.example.com/v1",
  "https://backup.example.com/v1",
]
timeout_ms = 15_000
headers = { authorization = "Bearer token", accept = "application/json" }

[database]
engine = "postgres"
host = "db.internal"
port = 5432
name = "highlight"
user = "app"
password = "s3cret!"
pool_size = 10
options = { sslmode = "require", connect_timeout = 5 }

[database.replicas]
us_east = "db-east.internal"
eu_west = "db-west.internal"

[features]
semantic_tokens = true
code_fences = true
line_prefixes = false
interpolation = true
experimental = ["diff-mode", "live-share"]

[[pipeline]]
stage = "lex"
workers = 4
command = ["lex", "--fast"]

[[pipeline]]
stage = "tokenize"
workers = 2
command = ["tokenize", "--all"]

[[pipeline]]
stage = "render"
workers = 1

[[pipeline.env]]
key = "RUST_LOG"
value = "info"

[[pipeline.env]]
key = "NO_COLOR"
value = "0"

[themes.dark]
name = "one-dark"
background = "#0b1120"
foreground = "#e2e8f0"

[themes.light]
name = "github-light"
background = "#ffffff"
foreground = "#0f172a"

[owners]
primary = { name = "Ada Lovelace", email = "ada@example.com", since = 2024-06-01 }
reviewers = [
  { name = "Grace Hopper", email = "grace@example.com" },
  { name = "Alan Turing", email = "alan@example.com" },
]

[package.metadata.docs]
homepage = "https://example.com"
repository = "https://github.com/example/highlight-demo"
keywords = ["syntax", "highlight", "tokens"]
categories = ["development-tools", "text-processing"]
