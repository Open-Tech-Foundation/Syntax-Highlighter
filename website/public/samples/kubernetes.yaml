# Showcase: Kubernetes — deployment, service, and ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: highlight-demo
  labels:
    app: highlight
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: highlight
  template:
    metadata:
      labels:
        app: highlight
    spec:
      containers:
        - name: app
          image: highlight-demo:0.4.0
          ports:
            - containerPort: 5173
          env:
            - name: NODE_ENV
              value: production
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: highlight-svc
spec:
  selector:
    app: highlight
  ports:
    - port: 80
      targetPort: 5173
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: highlight-ing
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: highlight-svc
                port:
                  number: 80
