# Showcase: Java .properties — flat keys and escapes.
# Application metadata
app.name=Syntax Highlighter
app.version=0.4.0
app.debug=false
app.workers=4
app.ratio=0.975

# Backslash continuations join lines
app.description=Modern, renderer-agnostic syntax \
  highlighting with one tokenizer.

# Separators: = : or whitespace all work
server.host: 127.0.0.1
server.port 5173
server.tls.enabled=false

# Escapes for special characters
path.windows=C:\\Program Files\\app
path.unix=/srv/app
message.welcome=Hello,\u0020world!
message.multiline=line one\nline two\ttabbed
key.with\ spaces=value with spaces
key\:with\:colons=colons need escapes too

# Unicode escapes decode on load
greeting.cafe=Caf\u00e9
greeting.snowman=\u2603

# Lists are comma conventions, not syntax
features=diff-mode,live-share,tokens

# Empty values are legal
empty.key=
blank.space=

! Exclamation comments work like hashes
logging.level.root=INFO
logging.level.app=DEBUG
