# Showcase: nginx — upstreams, TLS, caching, and limits.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined;

    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 8m;

    # Rate limiting: 10 req/s per IP with bursts.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Cache for rendered pages.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=pages:20m max_size=1g inactive=60m;

    upstream app {
        least_conn;
        server 127.0.0.1:5173 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5174 backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name example.com www.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name example.com;

        ssl_certificate /etc/ssl/cert.pem;
        ssl_certificate_key /etc/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        gzip on;
        gzip_types text/css application/json application/javascript;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache pages;
            proxy_cache_valid 200 5m;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;
            proxy_pass http://app;
        }

        location ~* \.(css|js|png)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
