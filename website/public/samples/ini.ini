; Showcase: INI — sections, keys, and interpolation.
[server]
host = 127.0.0.1
port = 5173
workers = 4
debug = false
timeout = 30.5
greeting = hello, world

[server.tls]
; Nested sections with dots
enabled = no
cert = /etc/ssl/cert.pem
key = /etc/ssl/key.pem

[database]
engine = postgres
host = db.internal
port = 5432
name = highlight
user = app
password = s3cret!
pool_size = 10
options = sslmode=require connect_timeout=5

[features]
semantic_tokens = true
code_fences = yes
line_prefixes = off
experimental = diff-mode, live-share

[themes]
; First value wins for duplicates
dark = one-dark
light = github-light
dark = dracula

[paths]
; ${section:key} interpolation
root = /srv/app
data = ${paths:root}/data
logs = ${paths:root}/logs/app.log

[empty_section]

# Hash comments work too
[final]
value = 42
