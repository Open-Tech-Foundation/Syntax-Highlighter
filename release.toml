adapters = ["npm"]
tag_format = "v{version}"
provider = "github"
default_branch = "main"
changelog_strategy = "curated"
changelog_scope = "root"
github_release_notes = "curated-changelog"

[hooks]

[publish.ignore_paths]
"@opentf/syntax-highlighter" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]

[[package]]
name = "@opentf/syntax-highlighter"
adapter = "npm"
mode = "publish"
matrix = false
command = "tsr build && cp ../../README.md README.md"
artifacts = ""
manifest = "packages/syntax-highlighter/package.json"
provenance = true

[[package.setup]]
uses = "Open-Tech-Foundation/ES-Runtime/.github/actions/setup-esdev@main"

[[package.setup]]
uses = "Open-Tech-Foundation/ES-Runtime/.github/actions/setup-tsr@main"
